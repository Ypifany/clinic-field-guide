<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 328" role="img" aria-label="Keep the evidence clear"><title>Keep the evidence clear</title><g fill="#17324d" font-family="Arial, sans-serif"><text x="12" y="30" font-size="23" font-weight="700">Keep the evidence clear</text><rect x="12" y="55" width="396" height="76" rx="3" fill="#f1f6fb" stroke="#b8cce0"/><text x="28" y="80" font-size="19" font-weight="700">Observation</text><text x="28" y="101" font-size="16">What did someone actually see or record?</text><text x="28" y="120" font-size="16">Keep the source, date, and scope.</text><rect x="12" y="143" width="396" height="76" rx="3" fill="#f1f6fb" stroke="#b8cce0"/><text x="28" y="168" font-size="19" font-weight="700">Interpretation</text><text x="28" y="189" font-size="16">What do you think the observation means?</text><text x="28" y="208" font-size="16">Show what supports that explanation.</text><rect x="12" y="231" width="396" height="76" rx="3" fill="#f1f6fb" stroke="#b8cce0"/><text x="28" y="256" font-size="19" font-weight="700">Unknown</text><text x="28" y="277" font-size="16">What can the available evidence not answer?</text><text x="28" y="296" font-size="16">Name the next useful check.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" id="food-bank-system-map" width="640" height="1080" viewBox="0 0 640 1080" role="img" aria-labelledby="map-title map-description">
  <title id="map-title">A food bank's digital space</title>
  <desc id="map-description">An introductory illustrative plan, not a verified inventory. A staff laptop connects by Wi-Fi to the local router, then through the internet to separate cloud email and folder services and an AI service. The agreed clinic scope may cover client devices, access, and account settings. The providers operate their cloud infrastructure outside the client's control. Staff manually type or paste sample text into the AI service, review its draft, and decide what to use. No direct connection between the AI service and cloud folders is assumed. Who can access data and how long the providers keep it are open questions to investigate.</desc>
  <defs>
    <marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#344b60"/></marker>
    <style>
      #food-bank-system-map text { font-family: Arial, Helvetica, sans-serif; fill: #172c40; }
      #food-bank-system-map .heading { font-size: 30px; font-weight: 700; }
      #food-bank-system-map .label { font-size: 24px; font-weight: 700; }
      #food-bank-system-map .small { font-size: 20px; }
      #food-bank-system-map .scope-text { fill: #55399c; }
      #food-bank-system-map .scope { fill: #f6f3fc; stroke: #7051b0; stroke-width: 2.5; stroke-dasharray: 9 6; }
      #food-bank-system-map .connection { fill: none; stroke: #344b60; stroke-width: 3; marker-end: url(#map-arrow); }
      #food-bank-system-map .exchange { marker-start: url(#map-arrow); }
      #food-bank-system-map .service { fill: #ffffff; stroke: #627b8b; stroke-width: 2; }
    </style>
  </defs>
  <rect width="640" height="1080" rx="16" fill="#ffffff"/>
  <text x="32" y="47" class="heading">A food bank's digital space</text>
  <text x="32" y="80" class="small">Illustrative plan — confirm with the client</text>

  <rect x="24" y="110" width="592" height="246" rx="18" class="scope"/>
  <text x="44" y="148" class="label scope-text">Agreed clinic scope</text>
  <text x="44" y="180" class="small">Client devices and access</text>

  <rect x="46" y="210" width="214" height="111" rx="12" class="service"/>
  <rect x="72" y="228" width="35" height="25" rx="3" fill="#e5edf3" stroke="#344b60" stroke-width="2"/>
  <path d="M65 258 H114" fill="none" stroke="#344b60" stroke-width="3"/>
  <text x="123" y="254" class="label">Laptop</text>
  <text x="72" y="290" class="small">Staff use a browser</text>

  <rect x="382" y="210" width="212" height="111" rx="12" class="service"/>
  <text x="406" y="253" class="label">Local router</text>
  <text x="406" y="290" class="small">Food bank Wi-Fi</text>
  <path d="M263 273 H377" class="connection exchange" aria-label="Two-way Wi-Fi connection"/>
  <text x="294" y="251" class="small">Wi-Fi</text>

  <rect x="234" y="390" width="172" height="65" rx="30" fill="#eaf0f5" stroke="#627b8b" stroke-width="2"/>
  <text x="320" y="431" class="label" text-anchor="middle">Internet</text>
  <path d="M488 324 V373 H320 V385" class="connection exchange" aria-label="Two-way internet connection through the router"/>

  <rect x="24" y="508" width="592" height="393" rx="18" fill="#edf4f6" stroke="#627b8b" stroke-width="2"/>
  <text x="320" y="546" class="label" text-anchor="middle">Cloud services</text>

  <rect x="46" y="575" width="258" height="177" rx="12" class="service"/>
  <text x="70" y="614" class="label">Email + folders</text>
  <text x="70" y="646" class="small">Messages and files</text>
  <rect x="60" y="669" width="230" height="67" rx="8" class="scope"/>
  <text x="175" y="697" class="small scope-text" text-anchor="middle">Client account</text>
  <text x="175" y="723" class="small scope-text" text-anchor="middle">and sharing settings</text>

  <rect x="336" y="575" width="258" height="177" rx="12" class="service"/>
  <text x="360" y="614" class="label">AI service</text>
  <text x="360" y="646" class="small">Drafts for staff review</text>
  <rect x="350" y="669" width="230" height="67" rx="8" class="scope"/>
  <text x="465" y="697" class="small scope-text" text-anchor="middle">Client account</text>
  <text x="465" y="723" class="small scope-text" text-anchor="middle">and use settings</text>

  <path d="M308 458 V477 H175 V568" class="connection exchange" aria-label="Mail and file exchange through the internet"/>
  <path d="M332 458 V477 H465 V568" class="connection exchange" aria-label="Staff send sample text and receive AI drafts through the internet"/>
  <rect x="102" y="484" width="146" height="29" rx="5" fill="#ffffff"/>
  <text x="175" y="506" class="small" text-anchor="middle">Mail / files</text>
  <rect x="360" y="484" width="210" height="29" rx="5" fill="#ffffff"/>
  <text x="465" y="506" class="small" text-anchor="middle">Sample text / drafts</text>

  <rect x="46" y="776" width="548" height="101" rx="12" fill="#dce7ed" stroke="#627b8b" stroke-width="2"/>
  <text x="70" y="812" class="label">Provider-managed infrastructure</text>
  <text x="70" y="845" class="small">Outside client and clinic control</text>

  <text x="32" y="936" class="small" font-weight="700">Staff type/paste sample text into AI.</text>
  <text x="32" y="966" class="small">Staff review the draft and choose what to use.</text>
  <text x="32" y="996" class="small">No direct AI–folder connection is assumed.</text>
  <text x="32" y="1035" class="small" font-weight="700">Ask each provider: who can access data?</text>
  <text x="32" y="1062" class="small">How long is it kept? What remains unknown?</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 328" role="img" aria-label="Safety in everyday terms"><title>Safety in everyday terms</title><metadata>Copyright 2026 Cheryl Abram / Ypifany. Current distribution: CC BY-NC 4.0. https://creativecommons.org/licenses/by-nc/4.0/</metadata><g fill="#17324d" font-family="Arial, sans-serif"><text x="12" y="30" fill="#17324d" font-size="23" font-weight="700">Safety in everyday terms</text><rect x="12" y="55" width="396" height="76" rx="5" fill="#eaf3ff" stroke="#246db5"/><text x="28" y="80" fill="#17232e" font-size="19" font-weight="700">Understand what is happening</text><text x="28" y="101" fill="#17232e" font-size="16">Find out what the system is doing.</text><text x="28" y="120" fill="#17232e" font-size="16">See how it affects people and the work.</text><rect x="12" y="143" width="396" height="76" rx="5" fill="#f2edff" stroke="#7450b2"/><text x="28" y="168" fill="#17232e" font-size="19" font-weight="700">Make a real choice</text><text x="28" y="189" fill="#17232e" font-size="16">Question, approve, refuse, or stop.</text><text x="28" y="208" fill="#17232e" font-size="16">Check that those choices actually work.</text><rect x="12" y="231" width="396" height="76" rx="5" fill="#e8f4ef" stroke="#275d4c"/><text x="28" y="256" fill="#17232e" font-size="19" font-weight="700">Put things right</text><text x="28" y="277" fill="#17232e" font-size="16">Correct mistakes and regain access.</text><text x="28" y="296" fill="#17232e" font-size="16">Restore the work or find help.</text></g></svg>
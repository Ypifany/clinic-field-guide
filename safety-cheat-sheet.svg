<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 328" role="img" aria-label="Sense, choose, recover"><title>Sense, choose, recover</title><metadata>Copyright 2026 Cheryl Abram / Ypifany. Current distribution: CC BY-NC 4.0. https://creativecommons.org/licenses/by-nc/4.0/</metadata><g fill="#17324d" font-family="Arial, sans-serif"><text x="12" y="30" fill="#17324d" font-size="23" font-weight="700">Sense, choose, recover</text><rect x="12" y="55" width="396" height="76" rx="5" fill="#eaf3ff" stroke="#246db5"/><text x="28" y="80" fill="#17232e" font-size="19" font-weight="700">Sense</text><text x="28" y="101" fill="#17232e" font-size="16">Notice exposure, events, and consequences.</text><text x="28" y="120" fill="#17232e" font-size="16">The affected person needs visibility.</text><rect x="12" y="143" width="396" height="76" rx="5" fill="#f2edff" stroke="#7450b2"/><text x="28" y="168" fill="#17232e" font-size="19" font-weight="700">Choose</text><text x="28" y="189" fill="#17232e" font-size="16">Understand options and question the action.</text><text x="28" y="208" fill="#17232e" font-size="16">Refusing and stopping must work.</text><rect x="12" y="231" width="396" height="76" rx="5" fill="#e8f4ef" stroke="#275d4c"/><text x="28" y="256" fill="#17232e" font-size="19" font-weight="700">Recover</text><text x="28" y="277" fill="#17232e" font-size="16">Regain access, correct records, or find help.</text><text x="28" y="296" fill="#17232e" font-size="16">Name what cannot be undone.</text></g></svg>